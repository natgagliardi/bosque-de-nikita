<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020713">
<title>Le Petit Peuple de la Montagne</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#020713}
body{overflow-x:hidden}
.scene{position:relative;width:100%;max-width:1536px;margin:0 auto;background:#020713;min-height:100vh}
#forest{display:block;width:100%;height:auto;opacity:0;transition:opacity .25s ease;user-select:none;-webkit-user-drag:none}
#forest.ready{opacity:1}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f3dfb8;font:600 16px Georgia,serif;letter-spacing:.08em;background:#020713;z-index:2}
.loading.hidden{display:none}
.hotspot{position:absolute;display:block;z-index:5;background:transparent;border:0;text-decoration:none}
.h-inicio{left:34.1%;top:2.2%;width:5.4%;height:5.2%}
.h-personajes{left:40.2%;top:2.2%;width:7.2%;height:5.2%}
.h-historia{left:47.2%;top:2.2%;width:6.8%;height:5.2%}
.h-tienda{left:54.2%;top:2.2%;width:4.8%;height:5.2%}
.h-contacto{left:59.6%;top:2.2%;width:6.2%;height:5.2%}
.h-cta{left:39.7%;top:39.6%;width:17.7%;height:5.8%}
.h-bram{left:16.2%;top:83.7%;width:11.2%;height:5.5%}
.h-tilo{left:44.1%;top:83.7%;width:11.2%;height:5.5%}
.h-nival{left:72.7%;top:83.7%;width:11.2%;height:5.5%}
</style>
</head>
<body>
<main class="scene" aria-label="Le Petit Peuple de la Montagne">
  <div id="loading" class="loading">Cargando el bosque…</div>
  <img id="forest" alt="Le Petit Peuple de la Montagne">
  <a class="hotspot h-inicio" href="#" aria-label="Inicio"></a>
  <a class="hotspot h-personajes" href="#personajes" aria-label="Personajes"></a>
  <a class="hotspot h-historia" href="#historia" aria-label="La Historia"></a>
  <a class="hotspot h-tienda" href="#tienda" aria-label="Tienda"></a>
  <a class="hotspot h-contacto" href="#contacto" aria-label="Contacto"></a>
  <a class="hotspot h-cta" href="#personajes" aria-label="Conocé a sus habitantes"></a>
  <a class="hotspot h-bram" href="#bram" aria-label="Ver más sobre Bram"></a>
  <a class="hotspot h-tilo" href="#tilo" aria-label="Ver más sobre Tilo"></a>
  <a class="hotspot h-nival" href="#nival" aria-label="Ver más sobre Nival"></a>
  <span id="personajes"></span><span id="historia"></span><span id="tienda"></span><span id="contacto"></span><span id="bram"></span><span id="tilo"></span><span id="nival"></span>
</main>
<script>
(async function(){
  const img=document.getElementById('forest');
  const loading=document.getElementById('loading');
  try{
    const paths=Array.from({length:8},(_,i)=>`assets/ref${String(i).padStart(2,'0')}.txt?v=20260908-final`);
    const parts=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar '+p);
      return (await r.text()).trim();
    }));
    img.onload=()=>{img.classList.add('ready');loading.classList.add('hidden')};
    img.onerror=()=>{loading.textContent='No se pudo cargar la imagen del bosque.'};
    img.src='data:image/webp;base64,'+parts.join('');
  }catch(e){
    loading.textContent='No se pudo cargar la imagen del bosque.';
    console.error(e);
  }
})();
</script>
</body>
</html>
