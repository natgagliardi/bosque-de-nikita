    <circle cx="630" cy="1835" r="16"/><circle cx="660" cy="1810" r="14"/><circle cx="690" cy="1840" r="15"/>
    <circle cx="3160" cy="1850" r="15"/><circle cx="3192" cy="1823" r="14"/><circle cx="3224" cy="1852" r="16"/>
    <circle cx="1010" cy="1930" r="12"/><circle cx="1040" cy="1910" r="11"/><circle cx="1070" cy="1932" r="12"/>
  </g>
  <g stroke="#7aa05b" stroke-width="9" fill="none" opacity=".75">
