    <path d="M160 0H460C400 260 520 520 455 820C390 1110 500 1370 350 1710" fill="url(#bark)" opacity=".75"/>
    <path d="M390 340C700 420 780 560 840 810C650 670 520 620 370 600Z" fill="#2b1a10"/>
    <path d="M450 810C720 820 850 960 930 1160C720 1060 560 1030 430 1060Z" fill="#2b1a10"/>
