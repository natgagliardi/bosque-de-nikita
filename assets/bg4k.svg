  <path d="M1710 1260C1820 1430 1750 1580 1560 2160H2310C2120 1610 2020 1435 2130 1260C2010 1190 1840 1190 1710 1260Z" fill="url(#path)" opacity=".74"/>
  <path d="M1840 1310C1900 1420 1840 1610 1725 1845" fill="none" stroke="#e0c184" stroke-opacity=".18" stroke-width="16"/>
  <path d="M2000 1300C1930 1460 2020 1630 2160 1880" fill="none" stroke="#5a3d27" stroke-opacity=".45" stroke-width="22"/>

