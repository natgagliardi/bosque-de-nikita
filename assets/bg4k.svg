    <rect x="-58" y="190" width="116" height="174" rx="18" fill="#352313" stroke="#bd8b4d" stroke-width="14"/>
    <rect x="-35" y="222" width="70" height="98" rx="12" fill="#ffcf69" opacity=".86"/>
    <circle cy="270" r="160" fill="url(#lantern)" filter="url(#blur24)"/>
  </g>

