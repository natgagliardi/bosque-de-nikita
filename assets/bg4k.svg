    <path d="M3670 0H3370C3435 280 3300 540 3375 840C3450 1120 3330 1380 3490 1730" fill="url(#bark)" opacity=".74"/>
    <path d="M3450 360C3150 440 3070 590 3000 840C3210 690 3340 650 3470 620Z" fill="#2b1a10"/>
    <path d="M3400 850C3130 860 2980 1020 2920 1190C3130 1080 3270 1060 3420 1090Z" fill="#2b1a10"/>
