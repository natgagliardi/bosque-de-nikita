    <path d="M270 0h92l88 1320h-205z" fill="#132417"/>
    <path d="M610 0h76l52 1240h-165z" fill="#17301b"/>
    <path d="M1050 0h70l42 1260h-165z" fill="#18361d"/>
    <path d="M1440 0h72l48 1210h-170z" fill="#17351d"/>
