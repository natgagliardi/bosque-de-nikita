    <path d="M15 92C50 18 205 -8 270 86C200 110 80 118 15 92Z" fill="#b54b32"/>
    <g fill="#f6dfb0"><circle cx="65" cy="72" r="15"/><circle cx="132" cy="48" r="19"/><circle cx="206" cy="70" r="13"/></g>
  </g>
  <g transform="translate(780 1670) scale(.62)">
    <path d="M105 250C90 145 108 88 142 68C177 90 191 150 173 250Z" fill="#ead8ad"/>
    <path d="M15 92C50 18 205 -8 270 86C200 110 80 118 15 92Z" fill="#d0673e"/>
    <g fill="#f7e1b4"><circle cx="65" cy="72" r="15"/><circle cx="132" cy="48" r="19"/><circle cx="206" cy="70" r="13"/></g>
  </g>

  <!-- mushrooms right -->
  <g transform="translate(3200 1510) scale(.88)">
    <path d="M105 250C90 145 108 88 142 68C177 90 191 150 173 250Z" fill="#ead8ad"/>
    <path d="M15 92C50 18 205 -8 270 86C200 110 80 118 15 92Z" fill="#b84f34"/>
    <g fill="#f6dfb0"><circle cx="65" cy="72" r="15"/><circle cx="132" cy="48" r="19"/><circle cx="206" cy="70" r="13"/></g>
  </g>
  <g transform="translate(3520 1740) scale(.5)">
    <path d="M105 250C90 145 108 88 142 68C177 90 191 150 173 250Z" fill="#ead8ad"/>
    <path d="M15 92C50 18 205 -8 270 86C200 110 80 118 15 92Z" fill="#d0673e"/>
  </g>

