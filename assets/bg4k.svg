  <!-- foreground vignette -->
  <rect width="3840" height="2160" fill="none" stroke="#020704" stroke-width="150" opacity=".42"/>
  <rect y="1320" width="3840" height="840" fill="url(#ground)" opacity=".1"/>

  <!-- firefly glows baked into the background -->
  <g fill="#ffe58f" filter="url(#glow)">
    <circle cx="930" cy="730" r="10"/><circle cx="1200" cy="510" r="8"/><circle cx="1510" cy="890" r="9"/>
    <circle cx="1880" cy="610" r="11"/><circle cx="2180" cy="820" r="9"/><circle cx="2520" cy="560" r="8"/>
    <circle cx="2860" cy="910" r="10"/><circle cx="1040" cy="1180" r="8"/><circle cx="2730" cy="1260" r="9"/>
