    <path d="M45 505V220C45 118 105 55 190 55S335 118 335 220V505Z" fill="#6f4725" stroke="#2b190f" stroke-width="14"/>
    <path d="M80 95Q190 30 300 95" fill="none" stroke="#c18a48" stroke-width="10" opacity=".7"/>
