<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102918"/>
      <stop offset=".38" stop-color="#1b3d22"/>
      <stop offset=".72" stop-color="#31552b"/>
      <stop offset="1" stop-color="#182516"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="24%" r="45%">
      <stop offset="0" stop-color="#fff1b2" stop-opacity=".72"/>
      <stop offset=".18" stop-color="#efd58a" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#c4d98e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b160d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31442a"/>
      <stop offset=".55" stop-color="#172417"/>
      <stop offset="1" stop-color="#090f0a"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a27d53" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5e4028" stop-opacity=".82"/>
    </linearGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d120c"/>
      <stop offset=".42" stop-color="#54321c"/>
      <stop offset=".72" stop-color="#2a190f"/>
      <stop offset="1" stop-color="#120c08"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7c6" stop-opacity="1"/>
      <stop offset=".22" stop-color="#ffd67b" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#ffb33a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb33a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur50"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".46"/></filter>
    <pattern id="bark" width="44" height="120" patternUnits="userSpaceOnUse">
      <path d="M6 0C22 24 3 47 18 73S31 105 14 120" fill="none" stroke="#8b5b31" stroke-opacity=".22" stroke-width="5"/>
      <path d="M34 0C19 28 39 55 27 86S18 109 30 120" fill="none" stroke="#120b08" stroke-opacity=".34" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#sun)"/>

  <!-- far forest haze -->
  <g opacity=".28" filter="url(#blur24)">
    <path d="M0 1120L0 370Q140 300 260 470T510 430T790 520T1080 400T1380 470T1680 390T1970 460T2280 360T2570 460T2860 350T3180 430T3490 350T3840 420V1160Z" fill="#264b2c"/>
    <path d="M0 1260V590Q170 470 360 660T740 590T1110 640T1470 560T1840 650T2190 550T2560 660T2910 560T3270 650T3840 590V1260Z" fill="#16341f"/>
